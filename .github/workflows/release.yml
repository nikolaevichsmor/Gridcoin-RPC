name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests before build
        run: |
          python -m unittest discover tests

      - name: Build executable
        run: |
          pyinstaller -y --clean --onedir --noconsole --icon "assets/app_icon.ico" --add-data "assets/tray_icon.ico;assets" --add-data "assets/app_icon.ico;assets" --exclude-module requests --exclude-module urllib3 --exclude-module cryptography --exclude-module PIL --exclude-module pystray --name "Gridcoin-RPC" main.py

      - name: Package zip archive & generate SHA256
        run: |
          $pkgName = "Gridcoin-RPC-$($env:GITHUB_REF_NAME)-win64.zip"
          Compress-Archive -Path "dist/Gridcoin-RPC" -DestinationPath "dist/$pkgName" -Force
          $hash = (Get-FileHash "dist/$pkgName" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "dist/$pkgName.sha256" -Value "$hash *$pkgName"
          Write-Host "Package created: $pkgName"
          Write-Host "SHA256: $hash"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/Gridcoin-RPC-*-win64.zip
            dist/Gridcoin-RPC-*-win64.zip.sha256

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests before build
        run: |
          python -m unittest discover tests

      - name: Build standalone Linux binary
        run: |
          pyinstaller -y --clean --onefile --exclude-module infi.systray --exclude-module requests --exclude-module urllib3 --exclude-module cryptography --exclude-module PIL --name "Gridcoin-RPC" main.py

      - name: Package tar.gz archive & generate SHA256
        run: |
          PKG_NAME="Gridcoin-RPC-${GITHUB_REF_NAME}-linux-x86_64.tar.gz"
          tar -czvf "dist/${PKG_NAME}" -C dist Gridcoin-RPC
          cd dist
          sha256sum "${PKG_NAME}" > "${PKG_NAME}.sha256"
          echo "Package created: ${PKG_NAME}"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/Gridcoin-RPC-*-linux-x86_64.tar.gz
            dist/Gridcoin-RPC-*-linux-x86_64.tar.gz.sha256

  publish-release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Gridcoin-RPC-*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
